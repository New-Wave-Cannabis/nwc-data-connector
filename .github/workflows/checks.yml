name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lessons-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest (each breaker must be caught)
        run: python3 scripts/lessons_proof.py --selftest
      - name: Lessons proof
        run: python3 scripts/lessons_proof.py
